<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030A17">
  <title>Descubriendo Flutter · en vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;600&family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header class="barra">
    <span class="punto" id="punto"></span>
    <span id="estado">conectando…</span>
    <span class="espacio"></span>
    <span id="conectados"></span>
  </header>

  <main>
    <section class="bienvenida" id="bienvenida" hidden>
      <p class="etiqueta">Descubriendo Flutter</p>
      <h1>¿Cómo te llamas?</h1>
      <p class="ayuda">Tu nombre aparece en la pantalla de la charla. Y guárdalo para el final: hay sorpresa.</p>
      <form id="formNombre" class="formulario">
        <input id="textoNombre" type="text" maxlength="28" autocomplete="given-name" autocapitalize="words" enterkeyhint="go" placeholder="Tu nombre" required>
        <button type="submit" class="boton">Entrar</button>
        <p class="nota" id="notaNombre"></p>
      </form>
    </section>

    <section class="yo" id="yo" hidden>
      <p class="etiqueta" id="saludo">Hoy eres</p>
      <div class="fila-widget">
        <h1 class="widget"><span id="widget"></span><span class="parentesis" id="parentesis">()</span></h1>
        <button type="button" class="info" id="info" aria-label="¿Qué hace este widget?" aria-expanded="false" aria-controls="burbuja" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25"/><path d="M12 10.75v5.5"/><circle cx="12" cy="7.6" r=".6" class="punto-info"/></svg>
        </button>
      </div>
      <p class="frase" id="frase"></p>
      <div class="burbuja" id="burbuja" role="tooltip" hidden>
        <p class="burbuja-etiqueta">¿Qué hace?</p>
        <p class="burbuja-titulo" id="burbujaTitulo"></p>
        <p class="burbuja-texto" id="burbujaTexto"></p>
        <p class="burbuja-pie">Widget de Flutter · toca afuera para cerrar</p>
      </div>
    </section>

    <section id="pantalla" class="pantalla" aria-live="polite"></section>

    <details class="preguntar" id="preguntar" hidden>
      <summary>¿Tienes una pregunta? Escríbela cuando quieras</summary>
      <form id="formPregunta" class="formulario">
        <textarea id="textoPregunta" maxlength="200" rows="3" placeholder="Tu pregunta para el final de la charla"></textarea>
        <button type="submit" class="boton">Enviar pregunta</button>
        <p class="nota" id="notaPregunta"></p>
      </form>
      <div class="mios" id="misPreguntasLista" hidden></div>
    </details>
  </main>

  <nav class="reacciones" aria-label="Reacciones">
    <button type="button" data-r="fuego"><span>🔥</span><small>hot reload</small></button>
    <button type="button" data-r="bug"><span>🐛</span><small>bug</small></button>
    <button type="button" data-r="aplauso"><span>👏</span><small>aplauso</small></button>
  </nav>

  <script src="/marcas.js"></script>
  <script src="/app.js"></script>
</body>
</html>
